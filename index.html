box-shadow:0 6px 22px #14253b08}.card h3{margin:0 0 8px}.card p{line-height:1.55}.stat{font-size:31px;font-weight:850;letter-spacing:-.04em;margin:8px 0 4px}.kicker{font-size:12px;color:#6d7d92;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero{background:linear-gradient(125deg,#102947,#1a5286);color:#fff;border-radius:22px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:17px}.hero h2{font-size:26px;letter-spacing:-.03em;margin:8px 0}.hero p{color:#c9d9eb;max-width:640px;line-height:1.6}.btn{border:0;border-radius:11px;background:#1764ad;color:#fff;padding:12px 17px;font-weight:750;min-height:43px}.btn:hover{filter:brightness(1.07)}.btn.light{background:#fff;color:#16497e}.btn.secondary{background:#e9f0f8;color:#21466e}.btn.danger{background:#fff1f1;color:#a5222d}.btn.ghost{background:transparent;border:1px solid #d9e3ef;color:#355572}.actions{display:flex;gap:10px;flex-wrap:wrap}.section{margin:29px 0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.section h2{font-size:19px;letter-spacing:-.02em;margin:0}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #e0e8f1;border-radius:14px;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.item strong{display:block;margin-bottom:4px}.item small{color:#738298}.meter{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:#2b82bb;border-radius:10px}.notice{background:#fff9e9;border:1px solid #f2e2b2;color:#775514;border-radius:12px;padding:14px 17px;line-height:1.5;font-size:13px}.success{background:#e9f7f0;border-color:#bfe5d0;color:#175d3a}.dangertext{color:#b02631}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd7e6;border-radius:10px;padding:12px;background:#fff;color:#1b2c42}.field textarea{min-height:95px;resize:vertical}.question{max-width:850px;margin:auto}.question h2{font-size:clamp(21px,2.5vw,29px);line-height:1.42;white-space:pre-wrap}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid #d4dfed;background:#fff;padding:16px;border-radius:12px;color:#1e2e44;line-height:1.5}.option.selected{border:2px solid #2370b7;background:#edf6ff}.option.correct{border:2px solid #208458;background:#ecf9f1}.option.wrong{border:2px solid #bd3b45;background:#fff0f0}.feedback{background:#edf5ff;border:1px solid #c8dff8;border-radius:14px;padding:18px;margin-top:16px;line-height:1.65}.feedback h3{margin:0 0 8px}.tag{display:inline-block;background:#e8eef7;color:#365a84;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800;margin:3px 4px 3px 0}.hr{border:0;border-top:1px solid #e4eaf2;margin:20px 0}.footerbar{position:sticky;bottom:0;background:#f5f7fbf5;border-top:1px solid #dce5f0;padding:14px 0;margin-top:25px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:42px 25px;text-align:center;background:#fff;border:1px dashed #bdccde;border-radius:17px;color:#66758a}.empty h3{color:#253750}.hidden{display:none!important}.tiny{font-size:12px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.bar{display:flex;align-items:center;gap:8px}.bar span{min-width:65px;text-align:right;font-size:12px;color:#66758a}.mobilehead{display:none}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch label{display:flex;gap:5px;align-items:center;padding:8px 10px;border:1px solid #dce4ed;border-radius:9px;background:#fff;font-size:13px}.count{color:#5b7594;font-size:13px;font-weight:700}.toast{position:fixed;bottom:22px;right:22px;z-index:100;background:#14273f;color:white;padding:13px 19px;border-radius:12px;box-shadow:0 10px 30px #10213944;max-width:min(90vw,500px)}@media(max-width:850px){.app{display:block}.side{height:auto;position:static;padding:12px 15px}.brand{margin:0;font-size:16px}.brand small,.sidefooter{display:none}.nav{display:flex;overflow-x:auto;gap:3px;margin-top:10px}.nav button{white-space:nowrap;padding:10px 11px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}main{padding:22px 16px 80px}.hero{padding:22px}.hero h2{font-size:23px}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.stat{font-size:25px}.hero{display:block}.item{align-items:flex-start;flex-direction:column}.item .btn{width:100%}.tabs button{flex:1;padding:9px}.top{margin-bottom:18px}.question h2{font-size:21px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">✚ Plantão Memorável<small>VERSÃO 2.0 · ESTUDO ADAPTATIVO</small></div><nav class="nav" id="nav"><button data-view="home" class="active">⌂ Início</button><button data-view="study">▤ Estudar</button><button data-view="simulations">◷ Simulados</button><button data-view="analytics">▥ Desempenho</button><button data-view="library">⇧ Banco de questões</button><button data-view="settings">⚙ Configurações</button></nav><div class="sidefooter">Offline após a instalação.<br>Conteúdo clínico exige revisão editorial.</div></aside><main id="main" aria-live="polite"></main></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const DB='plantao-memoravel-v2', STORE='questions', META='pm2_meta',PROG='pm2_progress',HIST='pm2_history';
const demo=[
{id:'DEMO-HEM-001',materia:'Choque e Hemodinâmica',competencia:'Perfusão e choque',provas:['TEMI','TEME'],tipo:'mcq',dificuldade:2,enunciado:'Paciente com choque séptico permanece hipotenso após ressuscitação inicial individualizada. Qual vasopressor é recomendado como primeira escolha?',alternativas:['Dopamina','Noradrenalina','Fenilefrina','Dobutamina'],correta:1,explicacao:'A noradrenalina é o vasopressor de primeira linha no choque séptico. A decisão de fluidos adicionais deve considerar responsividade e tolerância.',referencia:'Surviving Sepsis Campaign, diretrizes para adultos (2021).',status:'demonstracao'},
{id:'DEMO-VM-001',materia:'Ventilação Mecânica',competencia:'Mecânica respiratória',provas:['TEMI','TEME'],tipo:'mcq',dificuldade:2,enunciado:'Paciente passivo em ventilação controlada: pressão de platô 30 cmH₂O e PEEP total 14 cmH₂O. Qual a driving pressure?',alternativas:['12 cmH₂O','16 cmH₂O','18 cmH₂O','24 cmH₂O'],correta:1,explicacao:'Driving pressure = pressão de platô − PEEP total = 30 − 14 = 16 cmH₂O.',referencia:'Conceitos de mecânica respiratória em ventilação invasiva.',status:'demonstracao'},
{id:'DEMO-ECG-001',materia:'Cardiologia e ECG',competencia:'Arritmias',provas:['TEMI','TEME'],tipo:'mcq',dificuldade:3,enunciado:'Paciente com taquicardia irregular de QRS largo, instável, com suspeita de fibrilação atrial pré-excitada. Qual é a conduta prioritária?',alternativas:['Adenosina IV','Diltiazem IV','Cardioversão elétrica sincronizada','Digoxina IV'],correta:2,explicacao:'Instabilidade hemodinâmica com taquiarritmia exige cardioversão elétrica sincronizada, quando possível. Bloqueadores nodais podem ser perigosos na FA pré-excitada.',referencia:'Diretrizes de manejo de taquiarritmias e pré-excitação.',status:'demonstracao'},
{id:'DEMO-ACID-001',materia:'Hidroeletrolíticos e Ácido-Base',competencia:'Interpretação ácido-base',provas:['TEMI','TEME'],tipo:'curta',dificuldade:1,enunciado:'Qual é a fórmula convencional do ânion gap sérico sem potássio?',resposta:'Na − (Cl + HCO3)',aceitas:['sodio menos cloro e bicarbonato','na - (cl + hco3)','na-(cl+hco3)'],explicacao:'O ânion gap convencional é calculado como Na⁺ − (Cl⁻ + HCO₃⁻). A interpretação deve considerar a albumina.',referencia:'Princípios de interpretação dos distúrbios ácido-base.',status:'demonstracao'},
{id:'DEMO-TRA-001',materia:'Trauma',competencia:'Controle de hemorragia',provas:['TEME','TEMI'],tipo:'mcq',dificuldade:2,enunciado:'Vítima de trauma apresenta hemorragia externa grave em membro, não controlada por compressão direta adequada. Qual medida deve ser priorizada?',alternativas:['Esperar resultado do hemograma','Aplicar torniquete proximal à lesão','Administrar diurético','Retirar coágulos repetidamente'],correta:1,explicacao:'O torniquete é indicado para hemorragia grave de extremidade quando compressão direta é ineficaz ou inviável; documente o horário.',referencia:'Princípios contemporâneos de controle de hemorragia no trauma.',status:'demonstracao'},
{id:'DEMO-SEP-001',materia:'Sepse e Infectologia',competencia:'Controle de foco',provas:['TEMI','TEME'],tipo:'curta',dificuldade:2,enunciado:'Além de antimicrobianos e suporte, qual intervenção deve ser considerada precocemente na sepse com foco drenável?',resposta:'Controle de foco',aceitas:['drenagem do foco','source control','drenagem e controle do foco'],explicacao:'Controle de foco inclui drenagem, remoção de dispositivos infectados ou cirurgia, conforme a origem e a viabilidade.',referencia:'Surviving Sepsis Campaign (2021).',status:'demonstracao'}
];
let db, questions=[],meta=load(META,{track:'TEMI',theme:'light'}),progress=load(PROG,{}),history=load(HIST,[]),view='home',session=null,filterMateria='',filterTipo='all',filterStatus='all';
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem(META,JSON.stringify(meta));localStorage.setItem(PROG,JSON.stringify(progress));localStorage.setItem(HIST,JSON.stringify(history.slice(-4000)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3500)}
function idb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let s=r.result.createObjectStore(STORE,{keyPath:'id'});s.createIndex('materia','materia')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}function request(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function reload(){questions=await request(tx().getAll())}async function putAll(arr){let t=db.transaction(STORE,'readwrite');let s=t.objectStore(STORE);for(const q of arr)s.put(q);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});await reload()}
function normalize(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[⁺₋⁻₃]/g,c=>({'⁺':'+','₋':'-','⁻':'-','₃':'3'}[c])).replace(/[^a-z0-9]+/g,' ').trim()}
function uniq(a){return [...new Set(a)]}function valid(q){return q&&typeof q.id==='string'&&q.id.length>0&&typeof q.enunciado==='string'&&q.enunciado.trim()&&['curta','mcq'].includes(q.tipo)&&typeof q.materia==='string'&&q.materia.trim()&&(q.tipo==='curta'?typeof q.resposta==='string'&&q.resposta.trim():Array.isArray(q.alternativas)&&q.alternativas.length===4&&Number.isInteger(q.correta)&&q.correta>=0&&q.correta<4)}
function convert(raw){let list=[];const push=(q,mat)=>{let x={...q};x.materia=String(q.materia||mat||'Sem matéria');x.tipo=(q.tipo==='mcq'||Array.isArray(q.alternativas))?'mcq':'curta';x.provas=Array.isArray(q.provas)&&q.provas.length?q.provas.filter(v=>['TEMI','TEME'].includes(v)):['TEMI','TEME'];x.aceitas=Array.isArray(q.aceitas)?q.aceitas:[];x.competencia=q.competencia||q.topico||x.materia;x.dificuldade=Number(q.dificuldade)||2;x.status=q.status||'nao_validado';if(valid(x))list.push(x)};
if(Array.isArray(raw))raw.forEach(q=>push(q));else if(raw&&Array.isArray(raw.questoes))raw.questoes.forEach(q=>push(q,raw.materia?.titulo||raw.materia));else if(raw&&Array.isArray(raw.etapas)){for(const etapa of raw.etapas)(etapa.questoes||[]).forEach(q=>push(q,raw.materia?.titulo||raw.materia))}else throw Error('Formato não reconhecido. Envie JSON com questoes ou etapas.');if(!list.length)throw Error('Nenhuma questão válida encontrada.');let ids=new Set;for(const q of list){if(ids.has(q.id))throw Error('IDs duplicados no arquivo: '+q.id);ids.add(q.id)}return list}
function eligible(){return questions.filter(q=>q.provas.includes(meta.track))}function mastery(q){return progress[q.id]?.level||0}function due(q){return !progress[q.id]||progress[q.id].next<=Date.now()}function stats(){let a=eligible();return {total:a.length,studied:a.filter(q=>progress[q.id]).length,due:a.filter(due).length,mastered:a.filter(q=>mastery(q)>=3).length}}
function nav(v){view=v;session=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();window.scrollTo(0,0)}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)nav(b.dataset.view)});
function heading(title,desc,extra=''){return `<div class="top"><div><div class="eyebrow">${meta.track} · PLANTÃO MEMORÁVEL 2.0</div><h1>${title}</h1><p class="sub muted">${desc}</p></div>${extra}</div>`}
function track(){return `<div class="tabs"><button data-track="TEMI" class="${meta.track==='TEMI'?'active':''}">TEMI</button><button data-track="TEME" class="${meta.track==='TEME'?'active':''}">TEME</button></div>`}
function home(){let s=stats(),a=eligible(),subjects=uniq(a.map(q=>q.materia));return heading('Seu estudo, com direção','Treino adaptativo, prática deliberada e revisão espaçada.',track())+`<div class="hero"><div><div class="eyebrow" style="color:#a9d6ff">TREINO RECOMENDADO</div><h2>${s.total?'Continue de onde parou':'Prepare seu banco de questões'}</h2><p>${s.total?`${s.due} questões disponíveis para revisão ou primeiro contato. O sistema prioriza itens pendentes e competências com menor domínio.`:'O aplicativo está pronto. Importe um banco revisado ou carregue as 6 questões demonstrativas para testar as funções.'}</p><button class="btn light" data-action="${s.total?'start-due':'go-library'}">${s.total?'Começar revisão →':'Importar questões →'}</button></div><div style="font-size:58px;opacity:.9">✚</div></div><div class="grid"><div class="card"><div class="kicker">Questões disponíveis</div><div class="stat">${s.total}</div><div class="muted tiny">${subjects.length} matérias no percurso</div></div><div class="card"><div class="kicker">Já estudadas</div><div class="stat">${s.studied}</div><div class="muted tiny">${s.total?Math.round(s.studied/s.total*100):0}% do banco</div></div><div class="card"><div class="kicker">Domínio consolidado</div><div class="stat">${s.mastered}</div><div class="muted tiny">Nível 3 ou superior</div></div></div><div class="section"><h2>Como você quer treinar?</h2></div><div class="grid"><div class="card"><h3>⚡ Memorização</h3><p class="muted">Respostas curtas, feedback e confiança.</p><button class="btn secondary" data-action="start-short">Praticar</button></div><div class="card"><h3>▤ Questões clínicas</h3><p class="muted">Quatro alternativas e justificativa.</p><button class="btn secondary" data-action="start-mcq">Praticar</button></div><div class="card"><h3>◷ Simulado</h3><p class="muted">Sem feedback até o final; relatório por tema.</p><button class="btn secondary" data-action="go-simulations">Configurar</button></div></div><div class="section"><h2>Importante</h2></div><div class="notice">O aplicativo não inclui um banco clínico validado por padrão. Questões importadas são marcadas como não validadas quando não possuem status editorial. A pontuação mede desempenho no banco utilizado, não probabilidade de aprovação.</div>`}
function study(){let a=eligible(),subjects=uniq(a.map(q=>q.materia)).sort();let list=filterMateria?a.filter(q=>q.materia===filterMateria):a;let by=uniq(list.map(q=>q.materia)).sort();return heading('Estudar matérias','Escolha uma matéria e um tipo de treino.',track())+`<div class="card"><div class="field"><label for="subject">Filtrar por matéria</label><select id="subject"><option value="">Todas as matérias</option>${subjects.map(s=>`<option ${filterMateria===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div><div class="actions"><button class="btn" data-action="start-due">Revisão inteligente</button><button class="btn secondary" data-action="start-short">Resposta curta</button><button class="btn secondary" data-action="start-mcq">Múltipla escolha</button></div></div><div class="section"><h2>Matérias disponíveis</h2><span class="count">${by.length} matérias</span></div>${by.length?`<div class="list">${by.map(s=>{let q=a.filter(x=>x.materia===s),done=q.filter(x=>progress[x.id]).length;return `<div class="item"><div style="flex:1;min-width:150px"><strong>${esc(s)}</strong><small>${q.length} questões · ${done} estudadas</small><div class="meter" style="margin-top:10px"><i style="width:${Math.round(done/q.length*100)}%"></i></div></div><button class="btn secondary" data-action="subject" data-subject="${esc(s)}">Estudar</button></div>`}).join('')}</div>`:`<div class="empty"><h3>Sem matérias importadas</h3><p>Vá ao banco de questões para importar conteúdo.</p><button class="btn" data-action="go-library">Abrir banco</button></div>`}`}
function simulations(){return heading('Simulados','Treinamento sem feedback imediato, com correção ao final.',track())+`<div class="card" style="max-width:700px"><div class="field"><label for="simcount">Quantidade de questões</label><select id="simcount"><option value="10">10 questões</option><option value="20">20 questões</option><option value="40">40 questões</option><option value="80">80 questões</option></select></div><div class="field"><label for="simmateria">Matéria</label><select id="simmateria"><option value="">Todas</option>${uniq(eligible().map(q=>q.materia)).sort().map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div><p class="muted tiny">Os itens são sorteados sem repetição. O cronômetro é informativo; não há tempo oficial de prova definido.</p><button class="btn" data-action="start-sim">Iniciar simulado</button></div>`}
function analytics(){let a=eligible(),groups=uniq(a.map(q=>q.competencia)).sort(),total=history.filter(h=>h.track===meta.track),correct=total.filter(h=>h.correct).length;return heading('Meu desempenho','Acompanhamento por competência e histórico de estudo.',track())+`<div class="grid"><div class="card"><div class="kicker">Respostas registradas</div><div class="stat">${total.length}</div></div><div class="card"><div class="kicker">Taxa de acerto</div><div class="stat">${total.length?Math.round(correct/total.length*100)+'%':'—'}</div></div><div class="card"><div class="kicker">Revisões pendentes</div><div class="stat">${a.filter(q=>progress[q.id]&&due(q)).length}</div></div></div><div class="section"><h2>Competências</h2></div>${groups.length?`<div class="list">${groups.map(g=>{let q=a.filter(x=>x.competencia===g),done=q.filter(x=>progress[x.id]).length,level=q.length?Math.round(q.reduce((n,x)=>n+mastery(x),0)/q.length/4*100):0;return `<div class="item"><div style="flex:1"><strong>${esc(g)}</strong><small>${done}/${q.length} estudadas · índice de domínio ${level}%</small><div class="meter" style="margin-top:10px"><i style="width:${level}%"></i></div></div></div>`}).join('')}</div>`:`<div class="empty">Importe questões para acompanhar seu domínio.</div>`}<p class="muted tiny">O índice de domínio é uma heurística local de revisão espaçada, não uma medida psicométrica validada.</p>`}
function library(){let subjects=uniq(questions.map(q=>q.materia));let demos=questions.filter(q=>q.status==='demonstracao').length;return heading('Banco de questões','Importe, confira, faça backup e mantenha seu banco sob controle.')+`<div class="grid"><div class="card"><div class="kicker">Questões no dispositivo</div><div class="stat">${questions.length}</div></div><div class="card"><div class="kicker">Matérias</div><div class="stat">${subjects.length}</div></div><div class="card"><div class="kicker">Questões demonstrativas</div><div class="stat">${demos}</div></div></div><div class="section"><h2>Importar conteúdo</h2></div><div class="card"><p>Compatível com <b>JSON v2</b> (lista de questões ou objeto com <code>questoes</code>) e com os <b>JSON legados</b> das 32 matérias (objeto com <code>etapas</code>). O importador valida a estrutura, mas <b>não certifica o conteúdo médico</b>.</p><div class="field"><label for="file">Escolha um arquivo .json</label><input type="file" id="file" accept=".json,application/json"></div><div class="actions"><button class="btn" data-action="import">Importar JSON</button><button class="btn secondary" data-action="load-demo">Carregar demonstração (6 itens)</button><button class="btn ghost" data-action="export-bank">Exportar banco JSON</button></div><div id="importresult" style="margin-top:13px"></div></div><div class="section"><h2>Conteúdo instalado</h2></div>${subjects.length?`<div class="list">${subjects.sort().map(s=>{let q=questions.filter(x=>x.materia===s),un=q.filter(x=>x.status!=='validado').length;return `<div class="item"><div><strong>${esc(s)}</strong><small>${q.length} questões · ${un} sem validação editorial confirmada</small></div><button class="btn ghost" data-action="remove-subject" data-subject="${esc(s)}">Remover</button></div>`}).join('')}</div>`:`<div class="empty">Nenhum banco instalado. Importe um JSON ou carregue a demonstração.</div>`}`}
function settings(){return heading('Configurações','Seus dados ficam neste dispositivo, salvo quando você exporta um backup.')+`<div class="card" style="max-width:760px"><h3>Backup e restauração</h3><p class="muted">O backup inclui banco, histórico, progresso e preferências. Salve-o em Arquivos/iCloud para não perder dados ao limpar o navegador.</p><div class="actions"><button class="btn" data-action="backup">Exportar backup completo</button><button class="btn secondary" data-action="restore-pick">Restaurar backup</button><input id="restorefile" type="file" accept=".json" class="hidden"></div><hr class="hr"><h3>Limpar histórico</h3><p class="muted">Apaga progresso e respostas, sem excluir o banco de questões.</p><button class="btn danger" data-action="clear-progress">Apagar meu progresso</button><hr class="hr"><h3>Instalação e uso offline</h3><p>Abra a versão hospedada por HTTPS no Safari e selecione <b>Compartilhar → Adicionar à Tela de Início</b>. Depois da primeira carga online, o aplicativo pode abrir offline. As questões importadas ficam salvas no armazenamento local deste dispositivo.</p><p class="notice">No modo de navegação privada, ao limpar os dados do site ou em situações de pressão de armazenamento do sistema, os dados locais podem desaparecer. Faça backups regulares.</p></div>`}
function seeded(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}function start(kind,subject='',n=20){let pool=eligible().filter(q=>(!subject||q.materia===subject)&&(kind==='short'?q.tipo==='curta':kind==='mcq'||kind==='sim'?q.tipo==='mcq':true));if(kind==='due')pool.sort((a,b)=>(due(b)?1:0)-(due(a)?1:0)||mastery(a)-mastery(b));else pool=seeded(pool);pool=pool.slice(0,n);if(!pool.length){toast('Nenhuma questão compatível. Importe um banco ou altere a modalidade.');return}session={kind,ids:pool.map(q=>q.id),i:0,answers:[],chosen:null,revealed:false,confidence:80,started:Date.now(),subject};view='quiz';render();window.scrollTo(0,0)}
function quiz(){if(!session)return home();let q=questions.find(x=>x.id===session.ids[session.i]);if(!q)return '<div class="empty">Questão indisponível.</div>';let sim=session.kind==='sim',p=session.i+1,all=session.ids.length,prev=session.answers[session.i];return `<div class="question"><div class="top"><div><div class="eyebrow">${sim?'SIMULADO':session.kind==='due'?'REVISÃO ADAPTATIVA':'TREINO'} · ${meta.track}</div><h1>Questão ${p} de ${all}</h1><p class="sub muted">${esc(q.materia)} · ${esc(q.competencia)}</p></div><button class="btn ghost" data-action="exit-quiz">Sair</button></div><div class="meter" style="margin-bottom:18px"><i style="width:${Math.round((p-1)/all*100)}%"></i></div><div class="card"><span class="tag">${q.tipo==='mcq'?'Múltipla escolha':'Resposta curta'}</span><span class="tag">Dificuldade ${q.dificuldade||2}/3</span><span class="tag">${esc(q.status==='validado'?'Validada':'Não validada')}</span><h2>${esc(q.enunciado)}</h2>${q.tipo==='mcq'?`<div class="options">${q.alternativas.map((a,i)=>`<button class="option ${session.chosen===i?'selected':''} ${session.revealed&&i===q.correta?'correct':''} ${session.revealed&&session.chosen===i&&i!==q.correta?'wrong':''}" data-choice="${i}" ${session.revealed?'disabled':''}>${'ABCD'[i]}) ${esc(a)}</button>`).join('')}</div>`:`<div class="field"><label for="shortanswer">Sua resposta</label><textarea id="shortanswer" placeholder="Digite sua resposta antes de revelar o gabarito" ${session.revealed?'disabled':''}>${esc(session.chosen??'')}</textarea></div>`}${!sim?`<div class="field" style="margin-top:18px"><label for="confidence">Confiança na resposta</label><select id="confidence" ${session.revealed?'disabled':''}><option value="100" ${session.confidence===100?'selected':''}>100% — tenho certeza</option><option value="80" ${session.confidence===80?'selected':''}>80% — provável</option><option value="50" ${session.confidence===50?'selected':''}>50% — dúvida</option><option value="25" ${session.confidence===25?'selected':''}>25% — chute</option></select></div>`:''}${session.revealed?`<div class="feedback"><h3>${session.lastCorrect?'✓ Resposta correta':session.lastCorrect===false?'✕ Resposta incorreta':'Avalie sua resposta'}</h3><p><b>Gabarito:</b> ${esc(q.tipo==='mcq'?q.alternativas[q.correta]:q.resposta)}</p><p>${esc(q.explicacao||'Explicação ainda não cadastrada.')}</p><p class="tiny"><b>Referência cadastrada:</b> ${esc(q.referencia||'Não informada')}</p>${session.lastCorrect===null?`<div class="actions"><button class="btn" data-action="self-correct" data-correct="1">Minha resposta está correta</button><button class="btn secondary" data-action="self-correct" data-correct="0">Preciso revisar</button></div>`:''}</div>`:''}</div><div class="footerbar"><span class="muted tiny">${p}/${all} · ${Math.round((Date.now()-session.started)/60000)} min</span><div class="actions">${!session.revealed?`<button class="btn" data-action="reveal">${sim?'Registrar e avançar':'Conferir resposta'}</button>`:`<button class="btn" data-action="next" ${session.lastCorrect===null?'disabled':''}>${p===all?'Ver resultado':'Próxima questão →'}</button>`}</div></div></div>`}
function grade(q,answer){if(q.tipo==='mcq')return Number(answer)===q.correta;let x=normalize(answer),choices=[q.resposta,...(q.aceitas||[])].map(normalize);return choices.includes(x)}
function record(q,correct,answer,confidence){let old=progress[q.id]||{level:0,attempts:0};let level=correct?Math.min(4,old.level+(confidence>=80?1:0.5)):Math.max(0,old.level-1);let intervals=[0,1,3,7,21];progress[q.id]={level,attempts:old.attempts+1,correct:(old.correct||0)+(correct?1:0),next:Date.now()+intervals[Math.floor(level)]*86400000,last:Date.now()};history.push({id:q.id,track:meta.track,correct,answer:String(answer??''),confidence,date:Date.now(),kind:session.kind});save()}
function reveal(){let q=questions.find(x=>x.id===session.ids[session.i]);if(q.tipo==='curta')session.chosen=document.getElementById('shortanswer').value.trim();if(q.tipo==='mcq'&&session.chosen===null){toast('Escolha uma alternativa.');return}if(q.tipo==='curta'&&!session.chosen){toast('Digite sua resposta.');return}if(session.kind==='sim'){session.answers.push({id:q.id,answer:session.chosen,correct:grade(q,session.chosen)});if(session.i+1===session.ids.length){finish()}else{session.i++;session.chosen=null;render()}return}session.confidence=Number(document.getElementById('confidence').value);let correct=grade(q,session.chosen);session.lastCorrect=q.tipo==='curta'&&!correct?null:correct;session.revealed=true;if(session.lastCorrect!==null){record(q,correct,session.chosen,session.confidence);session.answers.push({id:q.id,correct})}render()}
function next(){session.i++;if(session.i>=session.ids.length){finish();return}session.chosen=null;session.revealed=false;session.lastCorrect=undefined;session.confidence=80;render();window.scrollTo(0,0)}function finish(){if(session.kind==='sim')for(const a of session.answers){let q=questions.find(x=>x.id===a.id);record(q,a.correct,a.answer,50)}session.finished=true;view='result';render();window.scrollTo(0,0)}
function result(){let arr=session?.answers||[],correct=arr.filter(a=>a.correct).length,pct=arr.length?Math.round(correct/arr.length*100):0;let wrong=arr.filter(a=>!a.correct);return heading('Treino concluído','Resultado deste conjunto de questões.')+`<div class="hero"><div><div class="eyebrow" style="color:#c7e4ff">SEU RESULTADO</div><h2>${correct} de ${arr.length} acertos · ${pct}%</h2><p>Revise as questões incorretas. Esta pontuação não prevê aprovação na prova de título.</p></div><button class="btn light" data-action="go-analytics">Meu desempenho</button></div><div class="section"><h2>Questões para revisar</h2></div>${wrong.length?`<div class="list">${wrong.map(a=>{let q=questions.find(x=>x.id===a.id);return `<div class="card"><strong>${esc(q?.enunciado||a.id)}</strong><p class="muted">${esc(q?.explicacao||'')}</p><p class="tiny"><b>Gabarito:</b> ${esc(q?.tipo==='mcq'?q.alternativas[q.correta]:q?.resposta)}</p></div>`}).join('')}</div>`:`<div class="notice success">Nenhuma resposta incorreta neste treino.</div>`}<div class="actions" style="margin-top:20px"><button class="btn" data-action="go-study">Voltar aos estudos</button></div>`}
function render(){let m=document.getElementById('main');m.innerHTML=({home,study,simulations,analytics,library,settings,quiz,result}[view]||home)();document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{meta.track=b.dataset.track;save();render()});let sub=document.getElementById('subject');if(sub)sub.onchange=()=>{filterMateria=sub.value;render()};let conf=document.getElementById('confidence');if(conf)conf.onchange=()=>session.confidence=Number(conf.value);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{session.chosen=Number(b.dataset.choice);render()});m.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b));}
async function action(b){let a=b.dataset.action;try{if(a.startsWith('go-')){nav(a.slice(3));return}if(a==='start-due'||a==='start-short'||a==='start-mcq'){start(a.slice(6),filterMateria);return}if(a==='subject'){filterMateria=b.dataset.subject;start('due',filterMateria);return}if(a==='start-sim'){let count=Number(document.getElementById('simcount').value),mat=document.getElementById('simmateria').value;start('sim',mat,count);return}if(a==='exit-quiz'){if(confirm('Sair deste treino? O progresso das questões já respondidas foi salvo.'))nav('study');return}if(a==='reveal'){reveal();return}if(a==='self-correct'){let q=questions.find(x=>x.id===session.ids[session.i]),ok=b.dataset.correct==='1';session.lastCorrect=ok;record(q,ok,session.chosen,session.confidence);session.answers.push({id:q.id,correct:ok});render();return}if(a==='next'){next();return}if(a==='load-demo'){await putAll(demo);toast('6 questões demonstrativas carregadas.');render();return}if(a==='import'){let f=document.getElementById('file').files[0];if(!f)throw Error('Escolha um arquivo JSON.');if(f.size>25e6)throw Error('Arquivo excede o limite de 25 MB.');let data=JSON.parse(await f.text()),list=convert(data);await putAll(list);toast(`${list.length} questões importadas/atualizadas.`);render();return}if(a==='remove-subject'){if(!confirm('Remover esta matéria e suas questões? O histórico permanecerá no dispositivo.'))return;let t=db.transaction(STORE,'readwrite'),s=t.objectStore(STORE);for(const q of questions.filter(x=>x.materia===b.dataset.subject))s.delete(q.id);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});await reload();render();return}if(a==='export-bank'){download('plantao-banco-v2.json',{schema_version:2,questoes:questions});return}if(a==='backup'){download('plantao-backup-v2.json',{kind:'plantao_backup_v2',created:new Date().toISOString(),questions,progress,history,meta});return}if(a==='restore-pick'){document.getElementById('restorefile').click();return}if(a==='clear-progress'){if(confirm('Apagar todo o histórico de respostas e domínio? Esta ação não pode ser desfeita sem backup.')){progress={};history=[];save();render()}return}}catch(e){toast('Erro: '+e.message);console.error(e)}}
function download(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('change',async e=>{if(e.target.id==='restorefile'){try{let f=e.target.files[0];if(!f)return;let d=JSON.parse(await f.text());if(d.kind!=='plantao_backup_v2'||!Array.isArray(d.questions)||!d.questions.every(valid))throw Error('Backup inválido.');if(!confirm(`Restaurar ${d.questions.length} questões e substituir seu histórico atual?`))return;let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});await putAll(d.questions);progress=d.progress||{};history=d.history||[];meta=d.meta||meta;save();render();toast('Backup restaurado.')}catch(err){toast('Erro ao restaurar: '+err.message)}}});
(async()=>{try{db=await idb();await reload();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){document.getElementById('main').innerHTML=`<div class="notice">Não foi possível abrir o armazenamento local (${esc(e.message)}). Use Safari/Chrome fora do modo privado e recarregue a página.</div>`}})();
</script></body></html>
